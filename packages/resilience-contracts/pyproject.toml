[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resilience-contracts"
version = "1.0.0"
description = "Contrats de données partagés entre le détecteur ML et le moteur de remédiation (RESILIENCE-ALPHA)."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
