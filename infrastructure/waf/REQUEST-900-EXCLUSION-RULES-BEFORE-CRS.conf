# Exclusions et règles locales RESILIENCE-ALPHA, chargées AVANT les règles OWASP CRS.
# Responsable : P4 — Cybersécurité.
#
# Règle d'or : chaque exclusion doit être justifiée par un faux positif constaté
# (identifiant de règle + extrait de modsec_audit.log), et documentée dans
# infrastructure/waf/README.md. Ne jamais désactiver le moteur globalement.

# Identifiants réservés au projet : 10000-10999.

# Les sondes internes de santé ne doivent pas polluer les journaux d'audit.
SecRule REQUEST_URI "@streq /healthz" \
    "id:10001,phase:1,pass,nolog,ctl:auditEngine=Off"

