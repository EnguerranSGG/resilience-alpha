# Features du détecteur ML et signaux de dégradation du moteur de remédiation.
# Consommateurs : ai/anomaly-detection/src/anomaly_detection/features.py
#                 remediation/src/remediation_engine/signals.py
#                 infrastructure/grafana/dashboards/resilience-overview.json
# Les routes /metrics et /health/* sont exclues pour ne mesurer que le trafic métier.
groups:
  - name: resilience-features
    interval: 5s
    rules:
      - record: resilience:request_rate:30s
        expr: |
          sum(rate(http_requests_total{job="payment-api", route!~"/metrics|/health/.*"}[30s])) or vector(0)

      - record: resilience:latency_p95_ms:30s
        # NaN sans trafic : filtré par ">= 0" puis remplacé par 0.
        expr: |
          (1000 * histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="payment-api", route!~"/metrics|/health/.*"}[30s])))
          >= 0) or vector(0)

      - record: resilience:error_rate:30s
        expr: |
          (sum(rate(http_requests_total{job="payment-api", route!~"/metrics|/health/.*", status=~"5.."}[30s])) or vector(0))
          /
          clamp_min(sum(rate(http_requests_total{job="payment-api", route!~"/metrics|/health/.*"}[30s])) or vector(0), 0.001)

      - record: resilience:cpu_usage:30s
        expr: sum(rate(process_cpu_seconds_total{job="payment-api"}[30s]))

      - record: resilience:active_requests
        expr: sum(http_requests_in_progress{job="payment-api"})

      - record: resilience:gateway_request_rate:30s
        expr: sum(rate(nginx_http_requests_total{job="gateway"}[30s]))
