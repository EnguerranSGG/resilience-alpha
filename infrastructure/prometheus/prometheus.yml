global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: resilience-alpha

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: payment-api
    static_configs:
      - targets: ["payment-api:8000"]

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8000"]

  - job_name: remediation
    static_configs:
      - targets: ["remediation:8000"]

  - job_name: ml-detector
    static_configs:
      - targets: ["ml-detector:8000"]

  - job_name: gateway
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
