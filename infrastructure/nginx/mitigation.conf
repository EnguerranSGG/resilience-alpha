# Profil MITIGATION — contexte `server`. Prévalidé, figé dans l'image de la passerelle.
# Appliqué uniquement par le playbook Ansible mitigate.yml, après `nginx -t`.
# Limite par IP : un client abusif reçoit des 429 sans pénaliser les autres adresses.
# TODO(P4) : évaluer un durcissement WAF (paranoïa CRS 2) dans ce profil.
set $gateway_profile mitigation;
limit_req  zone=per_ip_strict burst=10 nodelay;
limit_conn conn_per_ip 10;
