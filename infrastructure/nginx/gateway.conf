# Passerelle RESILIENCE-ALPHA : WAF ModSecurity/CRS + reverse proxy + rate limiting.
# Inclus dans le contexte `http` par /etc/nginx/nginx.conf (image OWASP CRS).
# ModSecurity est activé au niveau http par conf.d/modsecurity.conf (image).
#
# Chemin HTTP : client → gateway:8080 (WAF + limites) → frontend | payment-api | auth-service | remediation (GET public)
#
# IP client : la passerelle est le point d'entrée ; $remote_addr est l'adresse TCP du pair.
# Les en-têtes X-Forwarded-For / X-Real-IP envoyés par le client sont ÉCRASÉS, jamais ajoutés.

log_format gateway_json escape=json
    '{"ts":"$time_iso8601","log_type":"access","service":"gateway",'
    '"client_ip":"$remote_addr","method":"$request_method","uri":"$uri",'
    '"status":"$status","bytes":"$body_bytes_sent","request_time":"$request_time",'
    '"upstream_time":"$upstream_response_time","limit_req":"$limit_req_status",'
    '"profile":"$gateway_profile","request_id":"$request_id","user_agent":"$http_user_agent"}';

# Zones partagées par les profils (seules les zones référencées par le profil actif limitent).
limit_req_zone  $binary_remote_addr zone=per_ip_normal:10m rate=200r/s;
limit_req_zone  $binary_remote_addr zone=per_ip_strict:10m rate=5r/s;
limit_req_zone  $binary_remote_addr zone=login_per_ip:10m  rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

server_tokens off;

server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 64k;
    client_header_timeout 10s;
    send_timeout 15s;

    # Profil actif (normal ou mitigation), copié depuis /etc/nginx/profiles par profile-watcher.
    set $gateway_profile unknown;
    include /etc/nginx/active/profile.conf;

    access_log /var/log/gateway/access.log gateway_json;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header Connection        "";
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout    15s;
    proxy_send_timeout    15s;

    add_header X-Request-ID           $request_id always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY always;
    add_header Referrer-Policy        no-referrer always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/payments {
        set $upstream_payment payment-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_payment;
    }

    location /api/health/ {
        set $upstream_payment payment-api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_payment;
    }

    # Reconnaissance faciale — MFA back-office (Consigne Additionnelle 1)
    location /face/ {
        limit_req zone=login_per_ip burst=10 nodelay;
        set $upstream_face face-auth:8000;
        proxy_pass http://$upstream_face;
        # taille max pour les images base64 (frame JPEG ~ 30–150 kB)
        client_max_body_size 512k;
    }

    location = /auth/login {
        limit_req zone=login_per_ip burst=30 nodelay;
        limit_except POST { deny all; }
        set $upstream_auth auth-service:8000;
        proxy_pass http://$upstream_auth;
    }

    # Vues publiques en lecture seule du moteur de remédiation (dashboard).
    # POST /events n'est JAMAIS relayé : il n'est joignable que sur le réseau d'observabilité.
    location /api/remediation/ {
        limit_except GET { deny all; }
        set $upstream_remediation remediation:8000;
        rewrite ^/api/remediation/(status|incidents)$ /public/$1 break;
        return 404;
        proxy_pass http://$upstream_remediation;
    }

    location /api/ {
        return 404;
    }

    location / {
        set $upstream_frontend frontend:8080;
        proxy_pass http://$upstream_frontend;
    }
}

# Statut interne pour nginx-prometheus-exporter (port non publié).
server {
    listen 8081;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
