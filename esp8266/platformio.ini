; RESILIENCE-ALPHA — ESP8266 LED Controller
; PlatformIO / CLion
[env:nodemcuv2]
platform  = espressif8266
board     = nodemcuv2
framework = arduino

; Librairies
lib_deps =
    ESP Async WebServer
    ESPAsyncTCP

build_flags =
    -DWIFI_SSID=\"RESILIENCE-G13\"
    -DWIFI_PASS=\"Resilience2026!\"
    -DLED_GREEN=14
    -DLED_RED=12
    -DAUTO_OFF_MS=30000

monitor_speed = 115200
