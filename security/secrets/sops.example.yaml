# Modèle de configuration SOPS. Copier en .sops.yaml à la racine du dépôt
# et remplacer les destinataires par les clés PUBLIQUES age réelles de l'équipe.
# Les valeurs ci-dessous sont des marqueurs, pas des clés.
creation_rules:
  - path_regex: security/secrets/.*\.enc\.yaml$
    age: >-
      REMPLACER_PAR_CLE_PUBLIQUE_AGE_MEMBRE_1,
      REMPLACER_PAR_CLE_PUBLIQUE_AGE_MEMBRE_2
