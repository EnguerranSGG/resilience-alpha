# Config test LOCAL (même machine) — pour valider la chaîne avant le vrai réseau hotspot
target:
  host: "127.0.0.1"
  port: 8080
  path: "/api/payments"

attack:
  workers: 30
  requests_per_worker: 50
  duration_seconds: 30
  timeout: 5

payload:
  method: "POST"
  headers:
    Content-Type: "application/json"
    User-Agent: "RESILIENCE-ALPHA-FLOOD/1.0 (lab-only)"
  body:
    amount: 1
    currency: "EUR"
    payer_id: "FAKE-FLOOD-001"
    payee_id: "FAKE-FLOOD-002"
